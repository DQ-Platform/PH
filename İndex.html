
<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dövlət Qulluğu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            background: #161b22;
            width: 100%;
            max-width: 450px;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #30363d;
        }
        .pdf-group {
            display: flex;
            gap: 8px;
            margin: 15px 0;
            width: 100%;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            border: none;
        }
        .btn-name {
            flex: 4;
            background-color: #007bff; /* Mavi rəng */
            justify-content: flex-start;
            padding: 14px 15px;
            text-align: left;
        }
        .btn-download {
            flex: 1;
            background-color: #28a745; /* Yaşıl rəng */
            font-size: 20px;
            padding: 14px 10px;
        }
        .section-title {
            color: #8b949e;
            font-size: 14px;
            margin-top: 20px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="pdf-group">
            <a class="btn btn-name" href="Pənah Hüseynov(DQ yeni suallar)-2026.pdf" target="_blank">📄 PH-(DQ yeni suallar)-2026</a>
            <a class="btn btn-download" href="Pənah Hüseynov(DQ yeni suallar)-2026.pdf" download="P_H_DQ_Yeni_Suallar_2026.pdf">📥</a>
        </div>
        
        <div class="section-title">SOSİAL ŞƏBƏKƏ</div>
    </div>
</body>
</html>
