<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dövlət Qulluğu - 2026 Testcə</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            background: #161b22;
            width: 100%;
            max-width: 400px;
            padding: 25px 20px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid #30363d;
        }
        h1 { font-size: 22px; font-weight: bold; margin-bottom: 20px; color: #f0f6fc; }
        .pdf-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            width: 100%;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .btn-name {
            flex: 4;
            background-color: #0088cc;
            justify-content: flex-start;
            padding: 14px 15px;
            text-align: left;
        }
        .btn-download {
            flex: 1;
            background-color: #238636;
            font-size: 18px;
            padding: 14px 10px;
        }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>DÖVLƏT QULLUĞU</h1>
        
        <div class="pdf-group">
            <!-- PDF faylınızın adını buraya dəqiq yazın -->
            <a class="btn btn-name" href="Pənah Hüseynov(DQ yeni suallar)-2026.pdf" target="_blank">📄 2026 Testcə</a>
            <a class="btn btn-download" href="Pənah Hüseynov(DQ yeni suallar)-2026.pdf" download title="Yüklə">📥</a>
        </div>
    </div>
</body>
</html>
